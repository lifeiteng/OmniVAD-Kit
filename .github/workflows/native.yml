name: Native C/C++ Build

on:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build ncnn from source
        run: |
          git clone --depth 1 --branch 20241226 https://github.com/Tencent/ncnn.git /tmp/ncnn
          cmake -B /tmp/ncnn/build -S /tmp/ncnn \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_BUILD_TESTS=OFF \
            -DNCNN_SHARED_LIB=OFF \
            -DNCNN_VULKAN=OFF \
            -DNCNN_OPENMP=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/ncnn/install
          cmake --build /tmp/ncnn/build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake --install /tmp/ncnn/build

      - name: Configure
        run: cmake -B native/build -S native -DNCNN_ROOT=/tmp/ncnn/install

      - name: Build
        run: cmake --build native/build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Check binaries
        run: |
          ls -lh native/build/libomnivad*
          ls -lh native/build/test_*
          file native/build/test_all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            native/build/libomnivad*
            native/build/test_*
