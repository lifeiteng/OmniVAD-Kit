[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "omnivad"
version = "0.1.0"
description = "OmniVAD — Cross-platform Voice Activity Detection and Audio Event Detection (based on FireRedVAD)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "FeiTeng Li"},
]
keywords = [
    "vad",
    "voice-activity-detection",
    "audio-event-detection",
    "aed",
    "speech",
    "fireredvad",
    "omnivad",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/lifeiteng/OmniVAD-Kit"
Repository = "https://github.com/lifeiteng/OmniVAD-Kit"

[tool.scikit-build]
wheel.packages = ["omnivad"]
cmake.build-type = "Release"
cmake.define.CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
